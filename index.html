function resize(){DPR=Math.min(devicePixelRatio||1,LOW?1.5:2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
const add=p=>{if(Ps.length<MAX){p.t=0;Ps.push(p)}};
function confetti(x,y,n,spread,power,base){for(let i=0;i<N(n);i++){const a=base+rnd(-spread,spread),s=rnd(.35,1)*power;add({k:'c',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,rot:rnd(0,TAU),vr:rnd(-9,9),ph:rnd(0,TAU),w:rnd(6,11),h:rnd(10,16),col:pick(PAL),life:rnd(2.8,4.4)})}}
function rain(n){for(let i=0;i<N(n);i++)add({k:'c',x:rnd(0,W),y:-14,vx:rnd(-30,30),vy:rnd(20,80),rot:rnd(0,TAU),vr:rnd(-6,6),ph:rnd(0,TAU),w:rnd(6,10),h:rnd(10,14),col:pick(PAL),life:rnd(4,6)})}
function sparkles(x,y,n,r){for(let i=0;i<N(n);i++)add({k:'k',x:x+rnd(-r,r),y:y+rnd(-r,r),vx:rnd(-12,12),vy:rnd(-30,-8),r:rnd(5,11),col:pick(STAR),life:rnd(.5,1)})}
function smoke(x,y){for(let i=0;i<N(7);i++)add({k:'m',x:x+rnd(-4,4),y,vx:rnd(-8,8),vy:rnd(-42,-18),r:rnd(3,6),life:rnd(1,1.6)})}
function rocket(x,ty){add({k:'r',x,y:H+10,vy:-rnd(520,680),ty,col:pick(PAL),life:9});sfx.launch(rnd(.8,1.3))}
function explode(x,y,col){sfx.boom(rnd(.8,1.25));const n=N(rnd(60,95)),ring=Math.random()<.4;
  for(let i=0;i<n;i++){const a=i/n*TAU+rnd(-.05,.05),s=ring?210:rnd(60,250);add({k:'s',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,col:Math.random()<.75?col:pick(PAL),r:rnd(1.4,2.6),life:rnd(1,1.7)})}
  sparkles(x,y,6,60)}
function run(p,dt){
  p.t+=dt;const u=p.t/p.life;if(u>=1)return false;
  switch(p.k){
  case'c':p.vy=Math.min(p.vy+380*dt,230);p.vx*=1-1.2*dt;p.x+=p.vx*dt+Math.sin(p.t*4+p.ph)*28*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.scale(1,Math.cos(p.t*7+p.ph));cx.globalAlpha=u>.8?(1-u)*5:1;cx.fillStyle=p.col;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();break;
  case's':p.vx*=1-1.1*dt;p.vy=p.vy*(1-1.1*dt)+140*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;cx.globalAlpha=1-u;cx.strokeStyle=p.col;cx.lineWidth=p.r;cx.lineCap='round';
    cx.beginPath();cx.moveTo(p.x-p.vx*.06,p.y-p.vy*.06);cx.lineTo(p.x,p.y);cx.stroke();break;
  case'k':{const s=p.r*Math.sin(Math.PI*u);cx.globalAlpha=1;cx.fillStyle=p.col;cx.save();cx.translate(p.x+p.vx*p.t,p.y+p.vy*p.t);cx.rotate(p.t*1.5);cx.beginPath();
    for(let i=0;i<8;i++){const r=i%2?s*.28:s,a=i*Math.PI/4;cx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}cx.closePath();cx.fill();cx.restore();break}
  case'm':p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=14*dt;cx.globalAlpha=.4*(1-u);cx.fillStyle='#8f9db2';cx.beginPath();cx.arc(p.x,p.y,p.r,0,TAU);cx.fill();break;
  case'r':p.y+=p.vy*dt;if(p.y<=p.ty){explode(p.x,p.y,p.col);return false}
    cx.globalAlpha=1;cx.fillStyle=p.col;cx.beginPath();cx.arc(p.x,p.y,2.5,0,TAU);cx.fill();add({k:'s',x:p.x,y:p.y,vx:rnd(-15,15),vy:rnd(20,60),col:p.col,r:1.5,life:.5});break}
  return true}
/* balloons: pre-rendered sprites, gentle sway, tap in the margins to pop */
function sprite(col){const c=document.createElement('canvas');c.width=160;c.height=208;const g=c.getContext('2d');g.scale(2,2);
  g.fillStyle=col;g.beginPath();g.ellipse(40,40,30,36,0,0,TAU);g.moveTo(40,74);g.lineTo(34,84);g.lineTo(46,84);g.closePath();g.fill();
  let r=g.createRadialGradient(40,40,18,40,40,42);r.addColorStop(0,'rgba(0,0,0,0)');r.addColorStop(1,'rgba(0,0,0,.2)');g.fillStyle=r;g.beginPath();g.ellipse(40,40,30,36,0,0,TAU);g.fill();
  r=g.createRadialGradient(29,24,1,29,24,22);r.addColorStop(0,'rgba(255,255,255,.7)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.beginPath();g.ellipse(29,26,14,18,-.4,0,TAU);g.fill();return c}
const BC=[THEME.primary,THEME.secondary,THEME.light,THEME.secondary,THEME.primary,THEME.light],SP={};
const B=[.05,.93,.13,.86,.02,.97].map((fx,i)=>{const col=BC[i];SP[col]=SP[col]||sprite(col);return{fx,img:SP[col],s:rnd(.75,1.1),sp:rnd(24,44),f:rnd(.6,1.1),ph:rnd(0,TAU),y:RM?H*rnd(.25,.8):H+90,hold:RM?0:i*.45,px:0,py:0}});
function balloons(dt,t){for(const b of B){
  if(b.hold>0){b.hold-=dt;if(b.hold<=0){b.y=H+90;sfx.whoosh(.05)}continue}
  if(!RM)b.y-=b.sp*dt;if(b.y<-130)b.y=H+90;
  const sw=RM?0:Math.sin(t/1000*b.f+b.ph),s=b.s;b.px=b.fx*W+sw*14;b.py=b.y;
  cx.save();cx.translate(b.px,b.py);cx.rotate(sw*.1);cx.globalAlpha=.92;cx.strokeStyle='rgba(23,64,107,.28)';cx.lineWidth=1;
  cx.beginPath();cx.moveTo(0,38*s);cx.quadraticCurveTo(sw*10,70*s,-sw*6,108*s);cx.stroke();cx.drawImage(b.img,-40*s,-40*s,80*s,104*s);cx.restore()}}
addEventListener('pointerdown',e=>{if(e.target.closest('.card,button'))return;
  for(const b of B)if(b.hold<=0&&Math.hypot(e.clientX-b.px,e.clientY-b.py)<36*b.s){unlock();sfx.balloonPop();confetti(b.px,b.py,26,Math.PI,300,0);sparkles(b.px,b.py,6,20);b.hold=rnd(1,2.2);b.y=H+90;break}});
let last=0,raf=0;
function frame(t){raf=requestAnimationFrame(frame);const dt=Math.min((t-last)/1000||.016,.05);last=t;cx.clearRect(0,0,W,H);balloons(dt,t);
  for(let i=Ps.length-1;i>=0;i--){if(!run(Ps[i],dt)){Ps[i]=Ps[Ps.length-1];Ps.pop()}}cx.globalAlpha=1}
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0;AC&&AC.suspend()}else{if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}AC&&!muted&&AC.resume()}});

/* ============ 6. AUDIO ENGINE (Web Audio, starts only after first user interaction) ============ */
let AC=null,master,NB,muted=false,musicStarted=false;
function unlock(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();master=AC.createGain();master.gain.value=.65;master.connect(AC.destination);
  const n=AC.sampleRate;NB=AC.createBuffer(1,n,n);const d=NB.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}
  if(AC.state==='suspended')AC.resume()}
['pointerup','click','keydown'].forEach(e=>addEventListener(e,unlock,{capture:true}));
function tone(f,d,o={}){if(!AC||muted)return;const{type='sine',v=.2,t=0,to,a=.005}=o,s=AC.currentTime+t,os=AC.createOscillator(),g=AC.createGain();
  os.type=type;os.frequency.setValueAtTime(f,s);if(to)os.frequency.exponentialRampToValueAtTime(to,s+d);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+a);g.gain.exponentialRampToValueAtTime(.0001,s+d);
  os.connect(g);g.connect(master);os.start(s);os.stop(s+d+.05)}
function noise(d,o={}){if(!AC||muted)return;const{f=1000,to,q=1,type='bandpass',v=.2,t=0,a=.005}=o,s=AC.currentTime+t,src=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  src.buffer=NB;fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f,s);if(to)fl.frequency.exponentialRampToValueAtTime(to,s+d);
  g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+a);g.gain.exponentialRampToValueAtTime(.0001,s+d);src.connect(fl);fl.connect(g);g.connect(master);src.start(s);src.stop(s+d+.05)}
/* YouTube stays embedded: no media is downloaded or copied into the page. */
function ytCommand(func){const frame=$('#ytMusic');if(frame.contentWindow)frame.contentWindow.postMessage(JSON.stringify({event:'command',func,args:[]}), '*')}
function startMusic(){if(musicStarted){ytCommand('playVideo');return}musicStarted=true;const id=encodeURIComponent(CONTENT.musicVideoId);
  $('#ytMusic').src=`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&loop=1&playlist=${id}&controls=0&playsinline=1&enablejsapi=1${muted?'&mute=1':''}`}
const sfx={
  click(){tone(660,.07,{type:'triangle',v:.12,to:440})},
  tick(){tone(880,.08,{v:.05})},
  choice(){tone(520,.1,{type:'triangle',v:.12});tone(780,.14,{t:.07,v:.1})},
  candleTick(){tone(520,.07,{type:'triangle',v:.1})},
  sprk(n=4){for(let i=0;i<n;i++)tone(1400+rnd(0,1800),.18,{v:.05,t:i*.06+rnd(0,.03)})},
  pop(){tone(300,.14,{v:.3,to:700});sfx.sprk(3)},
  whoosh(v=.12){noise(.5,{f:400,to:2400,q:.8,v,a:.15})},
  gift(){tone(180,.1,{type:'square',v:.07,to:120});[523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,{type:'triangle',v:.12,t:.05+i*.07}));sfx.sprk(5)},
  balloonPop(){noise(.12,{type:'highpass',f:900,v:.4});tone(180,.1,{type:'triangle',v:.3,to:60})},
  confetti(){noise(.35,{type:'highpass',f:3000,v:.12,a:.02});tone(900,.2,{v:.06,to:1400});tone(1318,.25,{v:.05,t:.08})},
  launch(j=1){noise(.6,{f:500*j,to:2500*j,q:2,v:.1,a:.08});tone(300*j,.55,{type:'sawtooth',v:.03,to:1100*j})},
  boom(j=1){noise(.9,{type:'lowpass',f:2200*j,to:200,v:.5});tone(90*j,.5,{v:.35,to:40});for(let i=0;i<5;i++)noise(.04,{type:'highpass',f:3000+rnd(0,1500),v:.13,t:.1+i*.07+rnd(0,.05)})},
  blow(){noise(.45,{f:700,to:300,q:.7,v:.28,a:.06})},
  sting(){[523,659,784,1047].forEach((f,i)=>tone(f,.3,{type:'triangle',v:.16,t:i*.11}));[523,659,784,1047].forEach(f=>tone(f,.9,{type:'triangle',v:.08,t:.5}))}};

/* ============ 7. ANIMATION SYSTEM (screen transitions, entrances, final celebration) ============ */
let cur=1,busy=false,TM=[],queued=false;
const later=(fn,ms)=>{const id=setTimeout(fn,ms);TM.push(id);return id};
const sc=n=>$('#s'+n);
function cakeSVG(n){let c='';for(let i=0;i<n;i++){const x=100+(i-(n-1)/2)*26;
  c+=`<rect x="${x-3}" y="10" width="6" height="24" rx="2" style="fill:#fff;stroke:var(--primary);stroke-width:1.5"/><rect x="${x-3}" y="18" width="6" height="4" style="fill:var(--secondary)"/><path class="flame" d="M${x} -6C${x+6} 2 ${x+6} 8 ${x} 10C${x-6} 8 ${x-6} 2 ${x} -6Z" style="fill:var(--gold)"/>`}
  return `<svg class="cake" viewBox="0 ${n?-10:30} 200 ${n?124:84}" aria-hidden="true">${c}<ellipse cx="100" cy="102" rx="92" ry="7" fill="rgba(23,64,107,.12)"/><rect x="14" y="62" width="172" height="40" rx="14" style="fill:var(--primary)"/><path d="M14 74q14 12 28 0t28 0 28 0 28 0 28 0 28 0H186V62H14Z" fill="#fff"/><rect x="42" y="34" width="116" height="34" rx="12" style="fill:var(--secondary)"/><path d="M42 46q14 12 29 0t29 0 29 0 29 0V34H42Z" fill="#fff"/><g fill="#fff" opacity=".9"><circle cx="40" cy="90" r="3"/><circle cx="70" cy="92" r="3"/><circle cx="100" cy="90" r="3"/><circle cx="130" cy="92" r="3"/><circle cx="160" cy="90" r="3"/></g></svg>`}
function giftSVG(box,rib){return `<svg viewBox="0 0 100 108" aria-hidden="true"><ellipse cx="50" cy="102" rx="34" ry="5" fill="rgba(0,0,0,.09)"/><rect x="14" y="48" width="72" height="52" rx="8" style="fill:${box}"/><rect x="43" y="48" width="14" height="52" style="fill:${rib}"/><g class="lid"><rect x="8" y="34" width="84" height="20" rx="8" style="fill:color-mix(in srgb,${box},#fff 18%)"/><rect x="43" y="34" width="14" height="20" style="fill:${rib}"/><path d="M50 34C36 12 18 22 34 34ZM50 34C64 12 82 22 66 34Z" style="fill:${rib}"/></g></svg>`}
function candleSVG(){return `<svg viewBox="0 0 40 90" aria-hidden="true"><g class="flame"><path d="M20 2C30 15 30 26 20 32C10 26 10 15 20 2Z" style="fill:var(--gold)"/><path d="M20 14C25 20 25 26 20 30C15 26 15 20 20 14Z" style="fill:var(--secondary)" opacity=".85"/></g><rect x="19" y="32" width="2" height="7" fill="#444"/><rect x="12" y="38" width="16" height="48" rx="5" style="fill:color-mix(in srgb,var(--primary) 20%,#fff)"/><rect x="12" y="50" width="16" height="6" style="fill:var(--secondary)"/><rect x="12" y="66" width="16" height="6" style="fill:var(--secondary)"/></svg>`}
function enter(s){
  $$('.rise',s).forEach((el,i)=>{el.style.setProperty('--i',i);const k=el.dataset.snd;if(!k)return;
    later(()=>{sfx[k]&&sfx[k]();if(k!=='tick'){const r=el.getBoundingClientRect();sparkles(r.left+r.width/2,r.top+r.height/2,8,50)}},140+i*90+260)});
  const tb=$('.btn.hero,.btn.wish,.btn.fin',s);   // floating sparkles around the main button
  if(tb){const tw=()=>{if(!document.hidden){const r=tb.getBoundingClientRect();sparkles(r.left+rnd(0,r.width),r.top+rnd(-8,r.height),1,8)}later(tw,700)};later(tw,900)}}
function updateProgress(n){$('.step-count').textContent=String(n).padStart(2,'0')+' / 06';$('.progress span').style.width=(n/6*100)+'%'}
function go(n){if(busy||n===cur)return;busy=true;TM.forEach(clearTimeout);TM=[];const a=sc(cur),b=sc(n);
  a.classList.remove('on');a.classList.add('out');sfx.whoosh(.07);
  const r=$('.card').getBoundingClientRect();sparkles(r.left+r.width/2,r.top+r.height/2,10,Math.min(r.width,260)/2);
  setTimeout(()=>{a.classList.remove('out');b.classList.add('on');cur=n;updateProgress(n);document.body.classList.toggle('final',n===6);enter(b);scrollTo({top:0,behavior:RM?'auto':'smooth'});busy=false;if(n===6)celebrate()},300)}
function celebrate(){sfx.sting();const xs=[.2,.5,.8,.35,.65,.5].slice(0,RM?2:6);
  xs.forEach((f,i)=>later(()=>rocket(W*f+rnd(-30,30),H*rnd(.16,.4)),600+i*650));
  later(()=>{confetti(0,H*.8,60,.5,900,-.8);confetti(W,H*.8,60,.5,900,-Math.PI+.8);sfx.confetti()},900);
  for(let i=0;i<8;i++)later(()=>rain(14),1500+i*500);
  for(let i=0;i<10;i++)later(()=>sparkles(rnd(0,W),rnd(0,H*.6),3,40),1000+i*400)}

/* ============ 8. INTERACTION SYSTEM ============ */
const vhtml='<button class="play" aria-label="Play">▶</button><div class="vnote" hidden></div>';
function reveal(el,txt){el.textContent=txt;el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}
function openGift(b,i){if(b.classList.contains('shake'))return;const r=b.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height*.4;
  if(b.classList.contains('open')){sfx.sprk(3);sparkles(x,y,8,40);reveal($('#giftResult'),CONTENT['gift'+i]);sc(2).querySelector('[data-go]').disabled=false;return}
  b.classList.add('shake');sfx.candleTick();
  later(()=>{b.classList.remove('shake');b.classList.add('open');sfx.gift();sparkles(x,y,14,90);
    later(()=>{confetti(x,y,45,.9,380,-Math.PI/2);sfx.confetti()},160);later(()=>{reveal($('#giftResult'),CONTENT['gift'+i]);sc(2).querySelector('[data-go]').disabled=false},260)},450)}
function pick_(b,i){$$('.choice').forEach(c=>c.setAttribute('aria-pressed',c===b));sc(3).querySelector('[data-go]').disabled=false;sfx.choice();const r=b.getBoundingClientRect();sparkles(r.left+r.width/2,r.top+r.height/2,9,40);later(()=>reveal($('#answerResult'),CONTENT['answer'+i]),180)}
function blowCandle(c){if(c.dataset.b)return;c.dataset.b=1;sfx.candleTick();
  later(()=>{sfx.blow();c.classList.add('off');c.setAttribute('aria-pressed','true');const r=c.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+8;smoke(x,y);sparkles(x,y,5,18);
    const left=$$('.candle:not([data-b])').length;const hint=sc(5).querySelector('.sub');hint.textContent=left?`اضغطي على كل شمعة عشان تطفيها — باقي ${left} ${left===1?'شمعة':'شمعات'} ✨`:'اتمني أمنية… وخليها سر 🤫✨';
    if(!left&&!queued){queued=true;later(()=>go(6),1100)}},140)}
function play(){const v=$('#video');if(CONTENT.videoUrl){const e=document.createElement('video');e.src=CONTENT.videoUrl;e.controls=true;e.autoplay=true;e.playsInline=true;v.innerHTML='';v.appendChild(e)}
  else{const n=$('.vnote');n.textContent=CONTENT.videoNote;n.hidden=false;sfx.sprk(4)}}
function reset(){queued=false;$$('.gift').forEach(g=>g.classList.remove('open','shake'));$('#giftResult').textContent=CONTENT.giftHint;$('#giftResult').classList.remove('show');
  sc(2).querySelector('[data-go]').disabled=true;sc(3).querySelector('[data-go]').disabled=true;$$('.choice').forEach(c=>c.setAttribute('aria-pressed','false'));$('#answerResult').textContent='';
  sc(5).querySelector('.sub').textContent=CONTENT.candlesHint;$$('.candle').forEach(c=>{c.classList.remove('off');c.removeAttribute('data-b');c.setAttribute('aria-pressed','false')});$('#video').innerHTML=vhtml}
document.addEventListener('click',e=>{const t=e.target;let el;
  if(el=t.closest('.mute')){muted=!muted;if(master)master.gain.setTargetAtTime(muted?0:.65,AC.currentTime,.035);ytCommand(muted?'mute':'unMute');if(!muted)ytCommand('playVideo');el.querySelector('.sound-icon').textContent=muted?'×':'♫';el.querySelector('.sound-label').textContent=muted?'الموسيقى متوقفة':'أغنية عيد الميلاد';el.setAttribute('aria-pressed',muted);el.setAttribute('aria-label',muted?'تشغيل أغنية عيد الميلاد':'إيقاف أغنية عيد الميلاد');if(!muted){sfx.click();startMusic()}return}
  if(el=t.closest('.gift'))return openGift(el,+el.dataset.g);
  if(el=t.closest('.choice'))return pick_(el,+el.dataset.c);
  if(el=t.closest('.candle'))return blowCandle(el);
  if(t.closest('.play'))play();
  if(el=t.closest('[data-go]')){if(busy)return;const r=el.getBoundingClientRect(),x=r.left+r.width/2;
    if(el.dataset.fx==='hero'){startMusic();confetti(x,r.top,40,1.1,420,-Math.PI/2);sfx.confetti()}
    if(el.dataset.fx==='fin'){rocket(W*.3,H*.3);setTimeout(()=>rocket(W*.7,H*.25),250);confetti(x,r.top,50,1.2,480,-Math.PI/2);sfx.confetti();reset()}
    go(+el.dataset.go)}
  const b=t.closest('button');if(b){sfx.click();sparkles(e.clientX||0,e.clientY||0,5,24)}});

/* ---- init ---- */
$$('[data-cake]').forEach(e=>e.innerHTML=cakeSVG(+e.dataset.cake)+(e.id?'':''));
const gc=[[ 'var(--primary)','var(--secondary)'],['var(--secondary)','#fff'],['color-mix(in srgb,var(--primary) 40%,#fff)','var(--primary)']];
$('#gifts').innerHTML=gc.map((c,i)=>`<div class="rise" data-snd="sprk"><button class="gift" data-g="${i+1}" aria-label="Gift ${i+1}">${giftSVG(c[0],c[1])}</button></div>`).join('');
$('#choices').innerHTML=[1,2,3,4].map(i=>`<div class="rise"><button class="choice" data-c="${i}" aria-pressed="false"><span class="em">${CONTENT.choiceIcons[i-1]}</span><span data-text="choice${i}"></span></button></div>`).join('');
$('#candles').innerHTML=Array.from({length:5},(_,i)=>`<button class="candle" aria-pressed="false" aria-label="Candle ${i+1}">${candleSVG()}</button>`).join('');
$$('[data-text]').forEach(el=>{const v=CONTENT[el.dataset.text];if(v)el.textContent=v;else el.style.display='none'});
document.title=CONTENT.pageTitle;$('#video').innerHTML=vhtml;$('#giftResult').textContent=CONTENT.giftHint;
enter(sc(1));raf=requestAnimationFrame(frame);
</script>
</body></html>
